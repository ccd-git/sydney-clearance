name: IndexNow ping

# 每次推送到 main，等 GitHub Pages 发布完成后自动向 IndexNow 提交首页 URL。
# 这样"页面更新 → 通知搜索引擎"这一步永远是自动的，不需要手动跑。
# 注意：IndexNow 不包含 Google（参与者是 Bing / Yandex / Seznam / Naver）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages to publish
        run: sleep 60

      - name: Submit to IndexNow
        run: |
          set -euo pipefail
          KEY=$(tr -d '[:space:]' < .indexnow-key)
          BASE="https://ccd-git.github.io/sydney-clearance"
          echo "key = $KEY"
          CODE=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "{\"host\":\"ccd-git.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"$BASE/$KEY.txt\",\"urlList\":[\"$BASE/\"]}")
          echo "IndexNow HTTP $CODE"
          cat /tmp/resp.txt || true
          # 200/202 视为成功；其它状态让这一步失败，方便在 Actions 里看到
          case "$CODE" in
            200|202) echo "OK: URL accepted" ;;
            *) echo "Unexpected status from IndexNow"; exit 1 ;;
          esac
